# HSA_OVERRIDE_GFX_VERSION — required for AMD iGPU (e.g. GMKtec mini-PCs with AMD Radeon).
# Set in .env file: HSA_OVERRIDE_GFX_VERSION=10.3.0

services:
  vision-api:
    image: avzinin/vision-api-server:amd-${IMAGE_TAG:-latest}
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      YOLO_MODELS: ${YOLO_MODELS:-{"yolo26s.pt":"cuda:0","yolo26x.pt":"cuda:0"}}
      YOLO_MODEL_TTL: ${YOLO_MODEL_TTL:-900}
      YOLO_DEVICE: ${YOLO_DEVICE:-cuda:0}
      MODELS_DIR: /models
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VIDEO_CODEC: ${VIDEO_CODEC:-auto}
      VIDEO_CRF: ${VIDEO_CRF:-18}
      VIDEO_HW_ACCEL: ${VIDEO_HW_ACCEL:-amd}
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-}
      # Emergency lever against the MIOpen fd leak: fewer kernel compiles, at inference-perf cost.
      # MIOPEN_FIND_MODE: FAST
      # Process watchdog (supervisor.py): restarts the container when /health hangs.
      # Empty value = built-in default; see .env.example.
      WATCHDOG_ENABLED: ${WATCHDOG_ENABLED:-}
      WATCHDOG_STARTUP_TIMEOUT: ${WATCHDOG_STARTUP_TIMEOUT:-}
      WATCHDOG_FLAP_COOLDOWN: ${WATCHDOG_FLAP_COOLDOWN:-}
      WATCHDOG_MAIL_TO: ${WATCHDOG_MAIL_TO:-}
      WATCHDOG_MAIL_FROM: ${WATCHDOG_MAIL_FROM:-}
      WATCHDOG_SMTP_HOST: ${WATCHDOG_SMTP_HOST:-}
      WATCHDOG_SMTP_PORT: ${WATCHDOG_SMTP_PORT:-}
      WATCHDOG_SMTP_USER: ${WATCHDOG_SMTP_USER:-}
      WATCHDOG_SMTP_PASSWORD: ${WATCHDOG_SMTP_PASSWORD:-}
    restart: unless-stopped
    init: true  # tini as PID 1; supervisor.py and uvicorn are ordinary children it can signal
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    shm_size: 8G
    volumes:
      - models:/models
      - miopen-cache:/root/.cache/miopen    # compiled GPU kernels (MIOpen fd-leak containment)
      - miopen-config:/root/.config/miopen  # MIOpen find-db + lock files

volumes:
  models:
  miopen-cache:
  miopen-config:
