# Requires Docker Compose V2 (v2.20+) for GPU resource reservations.

services:
  vision-api:
    image: avzinin/vision-api-server:nvidia-${IMAGE_TAG:-latest}
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      YOLO_MODELS: ${YOLO_MODELS:-{"yolo26s.pt":"cuda:0","yolo26x.pt":"cuda:0"}}
      YOLO_MODEL_TTL: ${YOLO_MODEL_TTL:-900}
      YOLO_DEVICE: ${YOLO_DEVICE:-cuda:0}
      MODELS_DIR: /models
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VIDEO_CODEC: ${VIDEO_CODEC:-auto}
      VIDEO_CRF: ${VIDEO_CRF:-18}
      VIDEO_HW_ACCEL: ${VIDEO_HW_ACCEL:-nvidia}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # Process watchdog (supervisor.py): restarts the container when /health hangs.
      # Empty value = built-in default; see .env.example.
      WATCHDOG_ENABLED: ${WATCHDOG_ENABLED:-}
      WATCHDOG_STARTUP_TIMEOUT: ${WATCHDOG_STARTUP_TIMEOUT:-}
      WATCHDOG_FLAP_COOLDOWN: ${WATCHDOG_FLAP_COOLDOWN:-}
      WATCHDOG_MAIL_TO: ${WATCHDOG_MAIL_TO:-}
      WATCHDOG_MAIL_FROM: ${WATCHDOG_MAIL_FROM:-}
      WATCHDOG_SMTP_HOST: ${WATCHDOG_SMTP_HOST:-}
      WATCHDOG_SMTP_PORT: ${WATCHDOG_SMTP_PORT:-}
      WATCHDOG_SMTP_USER: ${WATCHDOG_SMTP_USER:-}
      WATCHDOG_SMTP_PASSWORD: ${WATCHDOG_SMTP_PASSWORD:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    volumes:
      - models:/models
    restart: unless-stopped
    init: true  # tini as PID 1; supervisor.py and uvicorn are ordinary children it can signal
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  models:
