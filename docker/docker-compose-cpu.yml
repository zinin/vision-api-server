services:
  yolo-api:
    build:
      context: ..
      dockerfile: docker/cpu/Dockerfile
    ports:
      - "3001:8000"
    environment:
      - YOLO_MODELS=${YOLO_MODELS:-'{"yolo26s.pt":"cpu","yolo26x.pt":"cpu"}'}
      - YOLO_MODEL_TTL=${YOLO_MODEL_TTL:-900}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VIDEO_CODEC=${VIDEO_CODEC:-auto}
      - VIDEO_CRF=${VIDEO_CRF:-18}
      - VIDEO_HW_ACCEL=cpu
      - YOLO_DEVICE=cpu
      - MODELS_DIR=/models
      # Process watchdog (supervisor.py) kill switch: false runs uvicorn unsupervised; empty = default (true).
      - WATCHDOG_ENABLED=${WATCHDOG_ENABLED:-}
    volumes:
      - models:/models
    restart: unless-stopped
    init: true  # tini as PID 1; supervisor.py and uvicorn are ordinary children it can signal
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  models:
