services:
  yolo-api:
    build:
      context: ..
      dockerfile: docker/nvidia/Dockerfile
    ports:
      - "3001:8000"
    environment:
      YOLO_MODELS: ${YOLO_MODELS:-'{"yolo26s.pt":"cuda:0","yolo26x.pt":"cuda:0"}'}
      YOLO_MODEL_TTL: ${YOLO_MODEL_TTL:-900}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VIDEO_CODEC: ${VIDEO_CODEC:-auto}
      VIDEO_CRF: ${VIDEO_CRF:-18}
      VIDEO_HW_ACCEL: ${VIDEO_HW_ACCEL:-nvidia}
      # Video annotation inference; empty = auto (FP16 + batch 8 on NVIDIA, FP32 + batch 1 elsewhere)
      VIDEO_FP16: ${VIDEO_FP16:-}
      VIDEO_BATCH_SIZE: ${VIDEO_BATCH_SIZE:-}
      YOLO_DEVICE: 'cuda:0'
      MODELS_DIR: /models
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # Process watchdog (supervisor.py) kill switch: false runs uvicorn unsupervised; empty = default (true).
      WATCHDOG_ENABLED: ${WATCHDOG_ENABLED:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    restart: unless-stopped
    init: true  # tini as PID 1; supervisor.py and uvicorn are ordinary children it can signal
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  models:
